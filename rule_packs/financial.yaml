pack: financial
label: "Financial (EMD / PBG / Payments)"
version: 2026.2
authority: "GFR 2017 (Rules 170-171)"
rules:
  - {id: FIN-001, title: "Earnest Money Deposit", citation: "GFR 2017, Rule 170", applies_to: [RFP], check: "emd_percent >= 2 and emd_percent <= 3", severity: mandatory, message: "Bid Security (EMD) must be 2-3% of the estimated project cost.", clause: "Per GFR 2017 Rule 170, Bid Security shall ordinarily be 2%-5% of estimated value.", fix_hint: "State EMD as 2% of project cost."}
  - {id: FIN-002, title: "Performance Bank Guarantee", citation: "GFR 2017, Rule 171", applies_to: [RFP], check: "pbg_percent >= 5 and pbg_percent <= 10", severity: mandatory, message: "Performance Security (PBG) must be 5-10% of the contract value.", clause: "Per GFR 2017 Rule 171, Performance Security of 5%-10% shall be obtained.", fix_hint: "State PBG as 5% of project cost."}
  - {id: FIN-003, title: "Payments tied to milestones", citation: "GFR 2017, Rule 176", applies_to: [RFP, DPR], check: "milestone_payments_sum_ok == True", severity: mandatory, message: "Milestone payments must add up to the total project cost.", clause: "Payments shall be linked to verifiable deliverables summing to contract value.", fix_hint: "Ensure milestone percentages sum to 100%."}
  - {id: FIN-004, title: "Estimated cost provided", citation: "GFR 2017, Rule 29", applies_to: [RFP, DPR], check: "project_cost > 0", severity: mandatory, message: "A positive estimated project cost is required.", clause: "A realistic cost estimate is a prerequisite before inviting bids.", fix_hint: "Enter the estimated project cost."}
